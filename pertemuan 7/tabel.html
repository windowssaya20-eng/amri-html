<!DOCTYPE html>
<html>
<head>
    <title>Tabel Mahasiswa</title>
    <style>
        td,
        th{
            border: 1px solid rgb(4, 0, 255);
            padding: 10px;
        }

        th {
            background-color: aqua;
            color: white;
            border-bottom: 1px solid rgb(255, 37, 244);
        }

        table {
            border-collapse: collapse;
            font-family: Arial, Helvetica, sans-serif;
        }

        tbody>tr{
            cursor: pointer;
        }

        tbody>tr:hover {
            background-color: rgb(8, 255, 8);
            color: rgb(227, 227, 227);
        }

        tr:nth-child(odd) {
            background-color: #e7e7e7;
        }

        .tbl-responsive {
            overflow-x: auto;
            width: 300px;
        }
    </style>

   
        
<body>

<table> 
    <caption>Tabel Mahasiswa</caption>
    <thead>
    <tr>
        <th rowspan="2">No</th>
        <th rowspan="2">NIM</th>
        <th colspan="3">Mahasiswa</th>
    </tr>

    <tr>
        <th>Nama</th>
        <th>Prodi</th>
        <th>Alamat</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>1</td>
        <td>2402011001</td>
        <td>Abima Algifari</td>
        <td>Teknik Informatika</td>
        <td>Gunung Medan</td>
    </tr>

    <tr>
        <td>2</td>
        <td>2402011002</td>
        <td>ADZIA SUKMA ERITA</td>
        <td>Teknik Informatika</td>
        <td>Sikabau</td>
    </tr>

    <tr>
        <td>3</td>
        <td>2402011003</td>
        <td>AGA SILVO YONDRA</td>
        <td>Teknik Informatika</td>
        <td>Blok B</td>
    </tr>
</tbody>
<tfoot>
    <tr>
        <td colspan="4">Jumlah</td>
        <td>3</td>
    </tr>
</tfoot>
</table>

</body>
</html>

<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

            <ul class="nav sidebar-nav flex-column">
                <li class="nav-item">

                        <span class="menu-lite">

                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="menu-lite">
                            <i class="fa-solid fa-user menu-icon"></i>
                            <span class="menu-text">Profil</span>
                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link active">
                        <span class="menu-lite">
                            <i class="fa-solid fa-desktop menu-icon"></i>
                            <span class="menu-text">Kartu Rencana Studi</span>
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">

                        </span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="menu-lite">
                            <i class="fa-solid fa-key menu-icon"></i>
                            <span class="menu-text">Ganti Password</span>
                        </span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="#" class="nav-link">
                        <span class="menu-lite">
                            <i class="fa-solid fa-sign-out menu-icon"></i>
                            <span class="menu-text">Logout</span>
                        </span>
                    </a>
                </li>
            </ul>
        </aside>

        <div id="content-wrapper">

            <header id="topbar" class="bg-body-tertiary border-bottom">

                <!-- BAGIAN KIRI -->
                <div class="d-flex align-items-center gap-3">
                    <button class="border-0 btn btn-outline-secondary">
                        <i class="fa-solid fa-bars fs-5"></i>
                    </button>

                    <h5 class="m-0">
                        Dashboard
                    </h5>
                </div>

                <!-- BAGIAN KANAN -->
                <div class="d-flex align-items-center gap-3 ms-auto">

                    <!-- TOMBOL THEME -->
                    <button class="border-0 btn btn-outline-secondary">
                        <i class="fa-solid fa-moon fs-5" id="themeIcon"></i>
                    </button>

                    <!-- DROPDOWN PROFIL -->
                    <div class="dropdown profile-dropdown">
                        <button class="btn btn-link text-decoration-none text-reset p-0" type="button"
                            data-bs-toggle="dropdown">

                            <i class="fa-solid fa-circle-user fs-4"></i>
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a href="#" class="dropdown-item">
                                    <i class="fa-solid fa-user me-2"></i>
                                    Profil
                                </a>
                            </li>
                        </ul>

            <main>
                <!--diisi saat di gunakan-->
            </main>
